<html>
  <head>
    <title>Forgot Password</title>
    <link rel="shortcut icon" href="/static/inbox.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/js/bootstrap.js"></script>
	  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400&display=swap" rel="stylesheet">
  </head>
<body class="bg-black">
  <header class="bg-black fixed-top">
		<div class="py-2">
		  <nav class="navbar navbar-expand-lg label bg-black" data-bs-theme="dark">
			<div class="container">
			  <a class="navbar-brand fs-4 text-white" href="{% url 'index' %}"><span style="color: #ff7800;">MY</span> MAIL</a>
			  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			  </button>
			  <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
				<ul class="navbar-nav mb-2 mb-lg-0">
				  <li class="nav-item">
					<a class="nav-link nav-color" aria-current="page" href="{% url 'index' %}">Home</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">About</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">Services</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">Contact</a>
				  </li>
				</ul>
			  </div>
			  <div class=""> 
				<ul class="navbar-nav me-2">
				  <li>
					<a class="nav-link nav-color" href="{% url 'userregister' %}">Sign Up</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="{% url 'login' %}">Sign In</a>
				  </li>
				</ul>
			  </div>
			</div>
		  </nav>
		</div>
	</header>
  <div class="container w-25 section-2">
    <form method="post" action="{% url 'newpasswordAction' %}">
        {% csrf_token %}
      <div class="mb-5">
        <h4 class="col-orange label text-center">Create A Password</h4>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control bg-dark text-white" name="newpassword" placeholder="New password">
      </div>
      <div class="mb-5">
        <input type="password" class="form-control bg-dark text-white" name="confirmpassword" placeholder="Confirm password">
      </div>
      <div class="d-flex justify-content-evenly">
        <button class="btn btn1" type="submit">Submit</button>
      </div>
    </form>
  </div>  
  <footer class="container fixed-bottom py-5 border-top border-light">
	<div class="text-white text-center opacity-75">
      <i class="fa-regular fa-copyright"></i> 2022 My Mail. All Rights Reserved
	</div>
  </footer>     
  <script src="https://kit.fontawesome.com/09fc86d1e6.js" crossorigin="anonymous"></script>
  </body>
</html>
