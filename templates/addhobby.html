<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/js/bootstrap.js"></script>
</head>
<body class="bg-black">
  <header class="fixed-top bg-black">
    <div class="py-2">
      <nav class="navbar navbar-expand-lg label bg-black" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand fs-4 text-white" href="{% url 'siteadminhome' %}"><span style="color: #ff7800;">MY</span> MAIL</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link nav-color" aria-current="page" href="{% url 'siteadminhome' %}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link nav-color" href="{% url 'userlist' %}">User List</a>
              </li>
            </ul>
          </div>
          <div class=""> 
            <ul class="navbar-nav me-2">
              <li class="nav-item">
                <a class="nav-link nav-color" href="{% url 'logout' %}">Log Out</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <div class="container w-50 section-2">
    <div class="col-md-12 col-sm-12 col-12">
      
      <h2 class="label col-orange text-center mb-5">ADD HOBBY</h2>
			<form method="post" action="{% url 'addhobbyAction' %}">
				  {% csrf_token %}
			<div class="mb-4">
				<input type="text" class="form-control bg-dark text-white" name="hobbyname" placeholder="Enter Hobby">
			</div>
			<div class="mb-3 mt-5 d-flex justify-content-evenly">
				<button class="btn btn1 text-white" type="submit">Submit</button>
			</div>
			</form>
		</div>
	</div>
  <footer class="container py-5 border-top border-light">
    <div class="text-white text-center opacity-75">
      <i class="fa-regular fa-copyright"></i> 2022 My Mail. All Rights Reserved
    </div>
  </footer>
</body>
</html>
