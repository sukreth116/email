<html>
	<head>
		<title>New Message</title>
		<link rel="stylesheet" href="/static/css/bootstrap.css">
		<link rel="stylesheet" href="/static/style.css">
		<script src="/static/js/bootstrap.js"></script>
	</head>
<script src="/static/jquery-1.8.3.min.js"></script>
<script>
$(document).ready(function(){
$("#receiver").change(function(){
var receiver = $("#receiver").val();
$.ajax({
	url : "{% url 'checkreceiver' %}",
	data : {'receiverid' : receiver},
	success : function(data){
	if(data.valid == "not exist")
		{
		alert("username not exist")
		$("#receiver").val();
		}
	}
})
})
})
</script>
<body>
  <header class="bg-black fixed-top">
    <div class="py-2">
	  <nav class="navbar navbar-expand-lg label bg-black" data-bs-theme="dark">
	    <div class="container">
		  <a class="navbar-brand fs-4 text-white" href="{% url 'userhome' %}"><span style="color: #ff7800;">MY</span> MAIL</a>
			  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			  </button>
			  <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
				<ul class="navbar-nav mb-2 mb-lg-0">
				  <li class="nav-item">
					<a class="nav-link nav-color" aria-current="page" href="{% url 'userhome' %}">Home</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">About</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">Services</a>
				  </li>
				  <li class="nav-item dropdown">
					<a class="nav-link dropdown-toggle nav-color" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
					  Factors
					</a>
					<ul class="dropdown-menu dropdown-menu-dark">
					  <li><a class="dropdown-item" href="#">Hobby Factor</a></li>
					  <li><a class="dropdown-item" href="#">Age Factor</a></li>
					  <li><a class="dropdown-item" href="#">Season-Country Factor</a></li>
					</ul>
				  </li>
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">Contact</a>
				  </li>
				</ul>
			  </div>
			  <div class=""> 
				<ul class="navbar-nav me-2">
				  <li class="nav-item">
					<a class="nav-link nav-color" href="#">Profile</a>
				  </li>
				  <li>
					<a class="nav-link nav-color" href="{% url 'logout' %}">Log Out</a>
				  </li>
				</ul>
			  </div>
			</div>
	   </nav>
	  </div>
	</header>

	<div class="bg-black text-white">
		<div class="container w-25 section-2">
				<form method="post" action="{% url 'new_messageAction' %}">
					{% csrf_token %}
				<div class="mb-5">
					<h2 class="label col-orange text-center">New Message</h2>
				</div>
				<div class="mb-3">
					<input type="text" class="form-control bg-dark text-white" name="receiver" placeholder="To">
				</div>
				<div class="mb-3">
					<input type="text" class="form-control bg-dark text-white" name="subject" placeholder="Subject">
				</div>
				<div class="mb-3">
					<textarea name="message" class="form-control bg-dark text-white" cols="21" rows="4" placeholder="Message"></textarea>
				</div>
				<div class="mt-4 d-flex justify-content-evenly">
					<button class="btn btn1" type="submit">Send</button>
				</div>
				</form>
				</div>  
			</div>
		</div>
	</div>
	<div class="bg-black fixed-bottom">
		<footer class="container py-5 border-top border-light">
		  <div class="text-white text-center opacity-75">
			<i class="fa-regular fa-copyright"></i> 2022 My Mail. All Rights Reserved
		  </div>
		</footer>
	</div>
</body>
{% if messages %}
{% for msg in messages %}
<script>
alert("{{msg}}")
</script>
{% endfor %}
{% endif %}
</html>
